  aws_eks_node_group: [cluster_name, node_group_name]
  aws_eks_addon: [cluster_name, addon_name]
  aws_eks_pod_identity_association: [cluster_name, namespace, service_account]
  aws_eks_access_entry: [cluster_name, principal_arn]
  aws_eks_access_policy_association: [cluster_name, principal_arn, policy_arn]
  aws_eks_fargate_profile: [cluster_name, fargate_profile_name]
  aws_eks_identity_provider_config: [cluster_name, oidc.0.identity_provider_config_name]

  # --- CloudFront / ACM / WAF ------------------------------------------
  aws_cloudfront_distribution: [aliases, comment]
  aws_cloudfront_cache_policy: [name]
  aws_cloudfront_function: [name]
  aws_cloudfront_origin_access_control: [name]
  aws_cloudfront_origin_access_identity: [comment]
  aws_cloudfront_origin_request_policy: [name]
  aws_cloudfront_response_headers_policy: [name]
  aws_cloudfront_key_value_store: [name]
  aws_acm_certificate: [domain_name]
  aws_acm_certificate_validation: [certificate_arn]
  aws_wafv2_web_acl: [name, scope]
  aws_wafv2_web_acl_association: [web_acl_arn, resource_arn]
  aws_wafv2_web_acl_logging_configuration: [resource_arn]
  aws_wafv2_ip_set: [name, scope]
  aws_wafv2_rule_group: [name, scope]

  # --- API Gateway ------------------------------------------------------
  aws_api_gateway_rest_api: [name]
  aws_api_gateway_resource: [rest_api_id, parent_id, path_part]
  aws_api_gateway_method: [rest_api_id, resource_id, http_method]
  aws_api_gateway_integration: [rest_api_id, resource_id, http_method]
  aws_api_gateway_method_response: [rest_api_id, resource_id, http_method, status_code]
  aws_api_gateway_integration_response: [rest_api_id, resource_id, http_method, status_code]
  aws_api_gateway_deployment: [rest_api_id]
  aws_api_gateway_stage: [rest_api_id, stage_name]
