# Identity attributes per resource type.
#
# `identity: <type>: [<attribute path>, ...]` lists the attributes whose values,
# taken together, uniquely name the cloud object a resource manages. Paths are
# dotted (`metadata.0.name`). All listed attributes must be present in the
# planned/state attributes for an identity to be built; attributes whose value
# is null (e.g. an unset `set_identifier`) are skipped. Types absent from this
# file fall back to the first present attribute among
# name, bucket, identifier, function_name, domain_name, cluster_identifier,
# cluster_id, replication_group_id, key.
#
# Users extend or override entries per type through `.tofu-overlay.yaml`
# (`identity:`); a user entry replaces the package entry for that type.

identity:
  # --- S3 ---------------------------------------------------------------
  aws_s3_bucket: [bucket]
  aws_s3_bucket_policy: [bucket]
  aws_s3_bucket_versioning: [bucket]
  aws_s3_bucket_public_access_block: [bucket]
  aws_s3_bucket_lifecycle_configuration: [bucket]
  aws_s3_bucket_server_side_encryption_configuration: [bucket]
  aws_s3_bucket_ownership_controls: [bucket]
  aws_s3_bucket_acl: [bucket]
  aws_s3_bucket_cors_configuration: [bucket]
  aws_s3_bucket_logging: [bucket]
  aws_s3_bucket_notification: [bucket]
  aws_s3_bucket_website_configuration: [bucket]
  aws_s3_bucket_replication_configuration: [bucket]
  aws_s3_bucket_object_lock_configuration: [bucket]
  aws_s3_bucket_request_payment_configuration: [bucket]
  aws_s3_bucket_accelerate_configuration: [bucket]
  aws_s3_bucket_intelligent_tiering_configuration: [bucket, name]
  aws_s3_bucket_inventory: [bucket, name]
  aws_s3_bucket_metric: [bucket, name]
  aws_s3_object: [bucket, key]

  # --- IAM --------------------------------------------------------------
  aws_iam_role: [name]
  aws_iam_policy: [name, path]
  aws_iam_user: [name]
  aws_iam_group: [name]
  aws_iam_instance_profile: [name]
  aws_iam_role_policy: [role, name]
  aws_iam_user_policy: [user, name]
  aws_iam_group_policy: [group, name]
  aws_iam_role_policy_attachment: [role, policy_arn]
  aws_iam_user_policy_attachment: [user, policy_arn]
  aws_iam_group_policy_attachment: [group, policy_arn]
  aws_iam_openid_connect_provider: [url]
  aws_iam_saml_provider: [name]
  aws_iam_service_linked_role: [aws_service_name, custom_suffix]

  # --- Lambda -----------------------------------------------------------
  aws_lambda_function: [function_name]
  aws_lambda_permission: [function_name, statement_id]
  aws_lambda_alias: [function_name, name]
  aws_lambda_layer_version: [layer_name]
  aws_lambda_event_source_mapping: [function_name, event_source_arn]
  aws_lambda_function_url: [function_name, qualifier]
  aws_lambda_function_event_invoke_config: [function_name, qualifier]
  aws_lambda_provisioned_concurrency_config: [function_name, qualifier]

  # --- Route53 ----------------------------------------------------------
  aws_route53_record: [zone_id, name, type, set_identifier]
  aws_route53_zone: [name]
  aws_route53_health_check: [fqdn, port, type]
  aws_route53_zone_association: [zone_id, vpc_id]

  # --- CloudWatch / Events / Scheduler ---------------------------------
  aws_cloudwatch_log_group: [name]
  aws_cloudwatch_log_stream: [log_group_name, name]
  aws_cloudwatch_log_subscription_filter: [log_group_name, name]
  aws_cloudwatch_log_metric_filter: [log_group_name, name]
  aws_cloudwatch_log_resource_policy: [policy_name]
  aws_cloudwatch_metric_alarm: [alarm_name]
  aws_cloudwatch_dashboard: [dashboard_name]
  aws_cloudwatch_event_bus: [name]
  aws_cloudwatch_event_rule: [event_bus_name, name]
  aws_cloudwatch_event_target: [event_bus_name, rule, target_id]
  aws_scheduler_schedule: [group_name, name]
  aws_scheduler_schedule_group: [name]

  # --- Messaging / data stores -----------------------------------------
  aws_sqs_queue: [name]
  aws_sqs_queue_policy: [queue_url]
  aws_sns_topic: [name]
  aws_sns_topic_policy: [arn]
  aws_sns_topic_subscription: [topic_arn, protocol, endpoint]
  aws_dynamodb_table: [name]
  aws_ecr_repository: [name]
  aws_ecr_repository_policy: [repository]
  aws_ecr_lifecycle_policy: [repository]
  aws_secretsmanager_secret: [name]
  aws_secretsmanager_secret_version: [secret_id]
  aws_secretsmanager_secret_policy: [secret_arn]
  aws_secretsmanager_secret_rotation: [secret_id]
  aws_ssm_parameter: [name]

  # --- KMS --------------------------------------------------------------
  aws_kms_key: [key_id]
  aws_kms_replica_key: [key_id]
  aws_kms_alias: [name]
  aws_kms_key_policy: [key_id]
  aws_kms_grant: [key_id, name]

  # --- Network ----------------------------------------------------------
  aws_vpc: [cidr_block, tags.Name]
  aws_subnet: [vpc_id, cidr_block]
  aws_route_table: [vpc_id, tags.Name]
  aws_route: [route_table_id, destination_cidr_block, destination_ipv6_cidr_block, destination_prefix_list_id]
  aws_route_table_association: [subnet_id, route_table_id]
  aws_internet_gateway: [vpc_id]
  aws_nat_gateway: [subnet_id, tags.Name]
  aws_eip: [tags.Name]
  aws_vpc_endpoint: [vpc_id, service_name]
  aws_security_group: [name, vpc_id]
  aws_security_group_rule: [security_group_id, type, protocol, from_port, to_port, cidr_blocks, ipv6_cidr_blocks, source_security_group_id, prefix_list_ids, self]
  aws_vpc_security_group_ingress_rule: [security_group_id, ip_protocol, from_port, to_port, cidr_ipv4, cidr_ipv6, referenced_security_group_id, prefix_list_id]
  aws_vpc_security_group_egress_rule: [security_group_id, ip_protocol, from_port, to_port, cidr_ipv4, cidr_ipv6, referenced_security_group_id, prefix_list_id]

  # --- Load balancing ---------------------------------------------------
  aws_lb: [name]
  aws_alb: [name]
  aws_lb_target_group: [name]
  aws_alb_target_group: [name]
  aws_lb_listener: [load_balancer_arn, port, protocol]
  aws_alb_listener: [load_balancer_arn, port, protocol]
  aws_lb_listener_rule: [listener_arn, priority]
  aws_lb_listener_certificate: [listener_arn, certificate_arn]

  # --- Databases / caches ----------------------------------------------
  aws_db_instance: [identifier]
  aws_db_subnet_group: [name]
  aws_db_parameter_group: [name]
  aws_db_option_group: [name]
  aws_db_proxy: [name]
  aws_rds_cluster: [cluster_identifier]
  aws_rds_cluster_instance: [identifier]
  aws_rds_cluster_parameter_group: [name]
  aws_rds_cluster_endpoint: [cluster_endpoint_identifier]
  aws_elasticache_cluster: [cluster_id]
  aws_elasticache_replication_group: [replication_group_id]
  aws_elasticache_serverless_cache: [name]
  aws_elasticache_subnet_group: [name]
