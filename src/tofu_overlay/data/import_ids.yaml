    - filename
    - source_code_hash
    - publish
    - skip_destroy
    - replace_security_groups_on_destroy
    - replacement_security_group_ids
  aws_lambda_layer_version:
    - filename
    - source_code_hash
    - skip_destroy
  aws_s3_bucket:
    - force_destroy
  aws_s3_object:
    - source
    - source_hash
    - force_destroy
  aws_iam_role:
    - force_detach_policies
  aws_ecr_repository:
    - force_delete
  aws_kms_key:
    - deletion_window_in_days
    - bypass_policy_lockout_safety_check
  aws_kms_replica_key:
    - deletion_window_in_days
    - bypass_policy_lockout_safety_check
  aws_kms_key_policy:
    - bypass_policy_lockout_safety_check
  aws_db_instance:
