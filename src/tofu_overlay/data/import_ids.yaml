  aws_secretsmanager_secret:
    - recovery_window_in_days
    - force_overwrite_replica_secret
  aws_cloudwatch_log_group:
    - skip_destroy
  aws_eks_addon:
    - resolve_conflicts_on_create
    - resolve_conflicts_on_update
    - preserve
  aws_eks_node_group:
    - force_update_version
  aws_eks_cluster:
    - bootstrap_self_managed_addons
  aws_dynamodb_table:
    - restore_source_name
    - restore_source_table_arn
    - restore_to_latest_time
    - restore_date_time
  aws_efs_file_system:
    - creation_token
  aws_cognito_user_pool:
    - deletion_protection
  helm_release:
    - values
    - set
    - set_sensitive
    - set_list
    - wait
    - wait_for_jobs
    - timeout
    - cleanup_on_fail
    - atomic
    - force_update
    - recreate_pods
    - reset_values
    - reuse_values
    - replace
    - disable_webhooks
    - disable_openapi_validation
    - dependency_update
    - lint
    - render_subchart_notes
    - verify
    - keyring
    - max_history
    - skip_crds
    - devel
    - pass_credentials
    - upgrade_install
  "kubernetes_*":
    - wait_for_default_secret
    - wait_for_rollout
    - wait_for_service_account_token
    - wait_until_bound
    - wait_for_load_balancer

ignored_attributes:
