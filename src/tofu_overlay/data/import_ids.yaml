# Import knowledge per resource type, used by `merge` to generate `import {}`
# blocks and by the verify plan.
#
# formats:            type -> import id format. `{attr}` placeholders are dotted
#                     attribute paths resolved against the overlay state
#                     (`{metadata.0.name}`). A `[...]` group is emitted only when
#                     every placeholder inside it resolves (optional suffixes).
#                     Types absent from this table default to `{id}` with a
#                     warning and strict no-op verification.
# non_importable:     types (glob patterns allowed) that cannot be imported;
#                     `merge` refuses overlays holding such create claims unless
#                     they are accepted for recreation.
# replace_prone:      types whose import is technically possible but whose plan
#                     after import almost always replaces the object; refused
#                     up-front by `merge`.
# virtual_attributes: type -> attributes that never round-trip through the
#                     provider (write-only or behavioural). A verify plan may
#                     show an `update` on a create claim when only these differ.
# ignored_attributes: type (glob, "*" = every type) -> attributes whose value
#                     depends on where tofu runs rather than on the config
#                     (local paths under TF_DATA_DIR, timestamps). An overlay
#                     `update` on a base resource that only changes these is
#                     not a branch change: not claimed, applied as is.
#
# Users extend the maps through `.tofu-overlay.yaml` (`import_ids:`,
# `virtual_attributes:`, `ignored_attributes:`, `non_importable:`,
# `replace_prone:`). Per-type import formats from the user replace package
# entries; attribute lists and the two type lists are unioned.

