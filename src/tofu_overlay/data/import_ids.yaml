    - password
    - skip_final_snapshot
    - apply_immediately
    - final_snapshot_identifier
    - allow_major_version_upgrade
    - delete_automated_backups
    - snapshot_identifier
    - restore_to_point_in_time
  aws_rds_cluster:
    - master_password
    - skip_final_snapshot
    - apply_immediately
    - final_snapshot_identifier
    - allow_major_version_upgrade
    - snapshot_identifier
    - restore_to_point_in_time
  aws_rds_cluster_instance:
    - apply_immediately
  aws_elasticache_cluster:
